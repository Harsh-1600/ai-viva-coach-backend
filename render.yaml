services:
  - type: web
    name: ai-viva-coach-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: JWT_SECRET_KEY
        value: prod-secret-viva-coach-2026-secure-jwt-key
      - key: TEACHER_INVITATION_CODE
        value: TEACH-COACH-2026
